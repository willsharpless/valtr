<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>valtr</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar" aria-label="Site header">
        <div class="brand">valtr <span class="brand-sub">sandbox</span></div>
        <nav class="topnav" aria-label="External links">
          <div class="mode-controls" aria-label="Display controls">
            <button id="theme-toggle" class="mode-toggle" type="button" aria-label="Toggle light or dark theme">
              <span data-key="light">L</span>
              <span data-key="dark">D</span>
            </button>
            <button id="layout-toggle" class="mode-toggle" type="button" aria-label="Toggle horizontal or vertical layout">
              <span data-key="horizontal">H</span>
              <span data-key="vertical">V</span>
            </button>
          </div>
          <a href="https://github.com/willsharpless/valtr" target="_blank" rel="noreferrer">code</a>
          <a href="https://willsharpless.github.io/valdec-site/" target="_blank" rel="noreferrer">paper</a>
        </nav>
      </header>

      <main class="workspace">
        <section class="viewer">
          <div class="graph-toolbar" aria-label="Graph controls">
            <button id="zoom-out" class="graph-tool" type="button" aria-label="Zoom out">-</button>
            <button id="zoom-reset" class="graph-tool" type="button" aria-label="Reset zoom">reset</button>
            <button id="zoom-in" class="graph-tool" type="button" aria-label="Zoom in">+</button>
          </div>
          <div id="graph-root" class="graph-root"></div>
        </section>

        <section class="composer">
          <label class="sr-only" for="spec-input">Specification</label>
          <textarea id="spec-input" spellcheck="false">F target_a && F target_b && G !wall</textarea>
          <div class="composer-actions">
            <div class="examples-menu">
              <button id="examples-button" class="examples-button" type="button" aria-haspopup="true" aria-expanded="false">
                examples
              </button>
              <div id="examples-dropdown" class="examples-dropdown" hidden></div>
            </div>
            <button id="render-button" type="button" aria-live="polite">booting pyodide</button>
          </div>
          <pre id="error-output" class="error-output" hidden></pre>
        </section>
      </main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
